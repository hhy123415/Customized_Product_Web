services:
  postgres:
    image: postgres:16
    container_name: myweb-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: hhy
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: my_design
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hhy -d my_design"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: myweb-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env.docker
    environment:
      DB_USER: hhy
      DB_HOST: postgres
      DB_NAME: my_design
      DB_PASSWORD: "123456"
      DB_PORT: "5432"
      JWT_SECRET: "221431"
      ENTERPRISE_REGISTER_CODE: "${ENTERPRISE_REGISTER_CODE:-6666}"
      ADMIN_REGISTER_CODE: "${ADMIN_REGISTER_CODE:-8888}"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3001:3001"
    volumes:
      - ./backend/uploads:/app/uploads
    networks:
      - default
      - myweb_dify_shared

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: myweb-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  postgres_data:

networks:
  myweb_dify_shared:
    name: myweb-dify-net
    external: true
